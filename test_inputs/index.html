{% extends "base.html" %}
{% block title %}Products{% endblock %}
{% block content %}
<h2 style="text-align:center; margin-bottom:20px;">Products List</h2>
<div style="text-align:center; margin-bottom:20px;">
    <a href="{{ url_for('add_product') }}" class="btn btn-success">+ Add New Product</a>
</div>
<div class="product-grid">
    {% for product in products %}
    <div class="product-card">
        <img src="{{ product.image }}" alt="{{ product.name }}"/>
        <h3>{{ product.name }}</h3>
        <p>Price: ${{ product.price }}</p>
        <a href="{{ url_for('product_detail', product_id=product.id) }}" class="btn btn-primary">View Details</a>
        <a href="{{ url_for('edit_product', product_id=product.id) }}" class="btn btn-warning">Edit</a>
        <a href="{{ url_for('delete_product', product_id=product.id) }}" class="btn btn-danger"
           onclick="return confirm('Delete this product?')">Delete</a>
    </div>
    {% endfor %}
</div>
{% endblock %}
